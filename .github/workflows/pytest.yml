name: Pyabacus Build and Test

on:
  pull_request:

jobs:
  test:
    name: PyTest
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/deepmodeling/abacus-gnu
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
            python-version: 3.8
      - name: Build ABACUS
        run: |
          cmake -B build -DENABLE_LCAO=ON
          cmake --build build -j4
          cmake --install build --prefix $HOME/.local/abacus
      - name: Build Pyabacus with ESolver
        run: |
          export ABACUS_INSTALL_DIR=$HOME/.local/abacus
          cd python/pyabacus
          python -m pip install -v .[test] --no-build-isolation
      - name: Test Pyabacus
        run: |
          cd python/pyabacus/tests
          pytest -v
